68,"metros":["Miami–Ft. Lauderdale","West Palm Beach","Orlando","Tampa","Jacksonville","Tallahassee"],"why":"#1 by far: 57,261 RBTs (21% of the US) and 41% of all BCaBAs; Trends #3; Miami leads the US for 'bcba' searches; CEU4ALL's home state and its OT market.","teaser":"57,261 RBTs · Medicaid requires the RBT","title":"Florida RBT & BCBA Requirements (2027) | CEU4ALL","description":"57,261 Florida RBTs need 12 PDUs before their 2028 renewal, and Florida Medicaid requires the RBT. Requirements for Florida RBTs, BCBAs and OTs.","h1":"RBT and BCBA requirements in Florida","focus":"Florida RBT requirements","intro":"Florida has more RBTs than any other state, and Florida Medicaid only pays technicians who hold the BACB's RBT. There's no state behavior analyst license yet, so the BACB's rules are the ones that count.","facts":[["RBTs in Florida","57,261, about 21% of all US RBTs (+4.6% in a year)"],["BCBAs / BCaBAs","10,045 BCBAs and 1,867 BCaBAs (41% of all US BCaBAs)"],["State license for behavior analysts","None today. The Agency for Persons with Disabilities recognizes national certification (§ 393.17, F.S.)"],["State CE on top of the BACB","None"],["RBTs and Medicaid","Required: technicians must be BACB-credentialed RBTs supervised by a BCBA or BCaBA (Rule 59G-4.125, F.A.C.)"],["What's changing","A state ABA Task Force (report due Dec 31, 2026) is discussing a licensure framework for BCBAs and BCaBAs"]],"sections":[["What Florida RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. Because Florida Medicaid requires the RBT, keeping it active is what keeps you billable."],["What Florida BCBAs and BCaBAs need","BACB recertification: 32 CE for BCBAs (20 for BCaBAs) every 2 years, with 4 in Ethics and Supervision CE if you supervise. There's no extra Florida CE today; watch the ABA Task Force's licensure recommendation."],["Florida OTs and OTAs","Licenses renew by February 28, 2027: 26 hours, including 2 hours of Prevention of Medical Errors, with up to 12 hours self-paced. CEU4ALL reports your hours to CE Broker."]],"faq":[["Do RBTs in Florida need a state license?","No. Florida has no state RBT credential. Florida Medicaid does require technicians to hold the BACB's Registered Behavior Technician credential."],["Does Florida require CE beyond the BACB's?","No. Florida behavior analysts follow the BACB's continuing education rules. A state task force is weighing a licensure framework, so this could change."],["How many RBTs are in Florida?","57,261 as of November 2026, about 21% of all RBTs in the US (BACB certificant data)."]],"keywords":["rbt florida requirements","florida rbt certification","registered behavior technician florida","florida medicaid rbt requirement","bcba florida requirements","florida behavior analyst license","rbt pdus florida"],"sources":"BACB certificant data (Nov 24, 2026); § 393.17, F.S.; Rule 59G-4.125, F.A.C.; AHCA ABA Task Force.","updated":"December 2026","wiki":"https://en.wikipedia.org/wiki/Florida"},{"slug":"texas","name":"Texas","rbt":31942,"bcba":5940,"bcaba":242,"share":"11.6%","grow":"+19.4%","trends":52,"metros":["Houston","Wichita Falls–Lawton"],"why":"#2: 31,942 RBTs, up 19.4% in a year; Texas Medicaid requires a certified technician; TDLR adds a human trafficking course for licensed analysts.","teaser":"31,942 RBTs · TDLR license · Medicaid requires certification","title":"Texas RBT & BCBA Requirements (2027) | CEU4ALL","description":"31,942 Texas RBTs need 12 PDUs every 2 years, and Texas Medicaid requires a certified technician. TDLR license and CE rules for Texas behavior analysts.","h1":"RBT and BCBA requirements in Texas","focus":"Texas RBT requirements","intro":"Texas licenses behavior analysts through TDLR and requires a certified technician for Medicaid. With nearly 32,000 RBTs and fast growth, it's the second-largest RBT market in the country.","facts":[["RBTs in Texas","31,942 (11.6% of the US), up 19.4% in a year"],["BCBAs / BCaBAs","5,940 BCBAs and 242 BCaBAs"],["State license for behavior analysts","Yes: the Texas Department of Licensing and Regulation (TDLR), Occupations Code ch. 506"],["State CE on top of the BACB","TDLR accepts current BACB or QABA certification as CE proof, and every renewal adds an HHSC-approved human trafficking prevention course"],["RBTs and Medicaid","Required: technicians must be registered or certified as an RBT, BCAT or ABAT (1 TAC § 354.5003)"],["Technicians","Not licensed by the state; supervised paraprofessionals are exempt"]],"sections":[["What Texas RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. Texas Medicaid requires an active technician certification, so your PDUs protect your job."],["What Texas behavior analysts need","Keep your BACB certification current (TDLR accepts it as your CE proof), renew your TDLR license every 2 years, and complete an HHSC-approved human trafficking prevention course at each renewal."]],"faq":[["Do RBTs in Texas need a state license?","No. Texas doesn't license technicians, but Texas Medicaid requires them to hold an RBT, BCAT or ABAT certification."],["What CE does TDLR require for behavior analysts?","TDLR accepts your current BACB or QABA certification as proof of continuing education. Each license renewal also requires an HHSC-approved human trafficking prevention course."],["How many RBTs are in Texas?","31,942 as of November 2026, up 19.4% in a year (BACB certificant data)."]],"keywords":["rbt texas requirements","rbt texas certification","registered behavior technician texas","tdlr behavior analyst license","texas behavior analyst ceu requirements","texas medicaid rbt requirement","bcba texas requirements"],"sources":"BACB certificant data (Nov 24, 2026); TDLR b  (LaBAs 20) starting with the Oct 31, 2027 renewal, and ACE courses count. Plus what Illinois RBTs need.","h1":"RBT and BCBA requirements in Illinois","focus":"Illinois RBT requirements","intro":"Illinois began licensing behavior analysts in 2025, and its CE requirement starts with the October 31, 2027 renewal: 30 hours for LBAs and 20 for LaBAs, and BACB ACE providers are approved sponsors.","facts":[["RBTs in Illinois","8,720 (3.2% of the US), up 15.9% in a year"],["BCBAs / BCaBAs","2,562 BCBAs and 47 BCaBAs"],["State license for behavior analysts","Yes: Behavior Analyst Licensing Act (225 ILCS 6), IDFPR"],["State CE on top of the BACB","From the 2027 renewal: 30 hours (LBA) / 20 hours (LaBA) per 24 months; BACB ACE providers are approved sponsors. Plus 1 hour of sexual harassment prevention each renewal and 1 hour of cultural competency every 6 years"],["Next license deadline","October 31, 2027 (odd years); the first renewal is exempt from CE"],["RBTs and Medicaid","Optional: an RBT or 18+ with a diploma/GED and state-approved training"]],"sections":[["What Illinois RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count."],["What Illinois behavior analysts need","Starting with the October 31, 2027 renewal: 30 CE hours for LBAs or 20 for LaBAs every 24 months. CE from BACB ACE providers, like CEU4ALL, counts toward it. Add 1 hour of sexual harassment prevention each renewal and 1 hour of cultural competency every 6 years (from the state's own provider list)."]],"faq":[["What CE do Illinois behavior analysts need?","From the 2027 renewal: 30 hours (LBA) or 20 hours (LaBA) every 24 months, plus 1 hour of sexual harassment prevention. BACB ACE providers are approved sponsors."],["When do Illinois behavior analyst licenses renew?","October 31 of odd-numbered years. The first renewal is exempt from CE; the 2027 renewal is  RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. Colorado Medicaid requires a certified technician, so keep your RBT active."],["What Colorado behavior analysts need","BACB recertification for now. Plan for the state license required from July 1, 2028; any Colorado CE rules are expected in 2027."]],"faq":[["When does Colorado require a behavior analyst license?","From July 1, 2028, under the Applied Behavior Analysis Practice Act (HB26-1425)."],["Does Colorado Medicaid require the RBT?","Colorado law has Medicaid pay for ABA delivered by technicians certified by a certifying entity, such as the BACB's RBT."],["How many RBTs are in Colorado?","8,529 as of November 2026, up 28.9% in a year (BACB certificant data)."]],"keywords":["colorado behavior analyst license 2028","rbt colorado requirements","registered behavior technician colorado","colorado medicaid rbt","bcba colorado requirements","hb26-1425"],"sources":"BACB certificant data (Nov 24, 2026); HB26-1425 (C.R.S. 12-247); C.R.S. 25.5-4-437.","updated":"December 2026","wiki":"https://en.wikipedia.org/wiki/Colorado"},{"slug":"arizona","name":"Arizona","rbt":7701,"bcba":1572,"bcaba":29,"share":"2.8%","grow":"+13.0%","trends":50,"metros":[],"why":"7,701 RBTs; AHCCCS requires RBT/ABAT/BCAT from Dec 1, 2026 (within 180 days of hire); Arizona sets its own 30-hour CE rule with a 25% self-study cap.","teaser":"AHCCCS RBT rule from Dec 1, 2026","title":"Arizona RBT & BCBA Requirements (2027) | CEU4ALL","description":"AHCCCS requires RBT, ABAT or BCAT from Dec 1, 2026, and Arizona analysts need 30 CE hours with 4 in ethics. What Arizona RBTs and BCBAs need.","h1":"RBT and BCBA requirements in Arizona","focus":"Arizona RBT requirements","intro":"Arizona Medicaid (AHCCCS) requires ABA technicians to hold an RBT, ABAT or BCAT starting December 1, 2026. Licensed behavior analysts follow Arizona's own CE rule: 30 hours including 4 in ethics.","facts":[["RBTs in Arizona","7,701 (2.8% of the US), up 13.0% in a year"],["BCBAs / BCaBAs","1,572 BCBAs and 29 BCaBAs"],["State license for behavior analysts","Yes: Arizona Board of Psychologist Examiners (A.R.S. 32-2091); no assistant license"],["State CE on top of the BACB","30 hours per license period, including 4 in ethics; BACB-approved providers count; self-study capped at 25% (R4-26-409)"],["RBTs and Medicaid","Required from Dec 1, 2026: RBT, ABAT or BCAT within 180 days of hire (AHCCCS AMPM 320-S)"],["Renewal timing","Every other year, by the end of your birth month"]],"sections":[["What Arizona RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. AHCCCS now requires the certification within 180 days of hire, across all AHCCCS plans."],["What Arizona behavior analysts need","30 CE hours per license period, including 4 in ethics, from BACB-approved providers. Arizona caps self-study and correspondence at 25% of the hours. Whether the Board counts on-demand online courses as self-study isn't settled, so check with the Board before relying on them for more than a quarter of your hours."]],"faq":[["Does AHCCCS require the RBT?","Yes, from December 1, 2026: ABA technicians need an RBT, ABAT or BCAT, started before their first service and earned within 180 days of hire."],["How many CE hours do Arizona behavior analysts need?","30 hours per license period, including 4 in ethics (R4-26-409). Self-study and correspondence count for at most 25%."],["How many RBTs are in Arizona?","7,701 as of November 2026, up 13.0% in a year (BACB certificant data)."]],"keywords":["arizona behavior analyst ce requirements","ahcccs rbt requirement","rbt arizona requirements","registered behavior technician arizona","bcba arizona license","arizona aba technician 180 days"],"sources":"BACB certificant data (Nov 24, 2026); A.A.C. R4-26-409; AHCCCS AMPM 320-S (effective Dec 1, 2026).","updated":"December 2026","wiki":"https://en.wikipedia.org/wiki/Arizona"},{"slug":"maryland","name":"Maryland","rbt":6554,"bcba":1398,"bcaba":29,"share":"2.4%","grow":"+27.1%","trends":68,"metros":[],"why":"Trends #4; 6,554 RBTs, up 27.1%; Maryland Medicaid's RBT rule is changing under a 2026 law.","teaser":"Medicaid RBT rule changing","title":"Maryland RBT & BCBA Requirements (2027) | CEU4ALL","description":"Maryland Medicaid requires the RBT today, and a 2026 law is changing the timing. What Maryland's 6,554 RBTs and 1,398 BCBAs need to renew.","h1":"RBT and BCBA requirements in Maryland","focus":"Maryland RBT requirements","intro":"Maryland licenses behavior analysts and, for now, requires Medicaid technicians to be BACB-registered RBTs within 90 days. A 2026 law lets the state move to a 150-day window instead.","facts":[["RBTs in Maryland","6,554 (2.4% of the US), up 27.1% in a year"],["BCBAs / BCaBAs","1,398 BCBAs and 29 BCaBAs"],["State license for behavior analysts","Yes: LBAs, State Board of Professional Counselors and Therapists (Health Occ. § 17-6A)"],["State CE on top of the BACB","None: follow the BACB and keep records for 4 years"],["RBTs and Medicaid","Today: RBT registered with the BACB, within 90 days of enrolling (COMAR 10.09.28.02)"],["What's changing","Ch. 867 (2026) may move to requiring certification within 150 days of starting services, once regulations are written"]],"sections":[["What Maryland RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. Maryland Medicaid requires the RBT today; the timing rule may change under the 2026 law."],["What Maryland behavior analysts need","Renew your LBA every 2 years with verified BACB certification. CE follows the BACB; keep your records for 4 years."]],"faq":[["Does Maryland Medicaid require the RBT?","Yes, today: technicians must be BACB-registered RBTs within 90 days. A 2026 law allows a 150-day window once new regulations are adopted."],["Does Maryland require CE beyond the BACB?","No. Maryland follows the BACB's CE rules and asks you to keep records for 4 years."],["How many RBTs are in Maryland?","6,554 as of November 2026, up 27.1% in a year (BACB certificant data)."]],"keywords":["rbt maryland requirements","maryland medicaid rbt","registered behavior technician maryland","maryland behavior analyst license","bcba maryland requirements"],"sources":"BACB certificant data (Nov 24, 2026); COMAR 10.58.16.07, 10.09.28.02; Ch. 867 (SB 898, 2026).","updated":"December 2026","wiki":"https://en.wikipedia.org/wiki/Maryland"},{"slug":"new-jersey","name":"New Jersey","rbt":5968,"bcba":4118,"bcaba":114,"share":"2.2%","grow":"+27.1%","trends":64,"metros":[],"why":"Trends #5; 4,118 BCBAs (the 5th most in the US, 1.4 RBTs per BCBA): a BCBA-heavy market; DDD exemption ends May 6, 2027.","teaser":"4,118 BCBAs · DDD exemption ends 2027","title":"New Jersey RBT & BCBA Requirements (2027) | CEU4ALL","description":"New Jersey's 4,118 BCBAs renew with BACB CE, and the DDD licensing exemption ends May 6, 2027. What NJ RBTs and behavior analysts need.","h1":"RBT and BCBA requirements in New Jersey","focus":"New Jersey RBT requirements","intro":"New Jersey has one of the highest concentrations of BCBAs in the country and a state license for behavior analysts. The licensing exemption for Division of Developmental Disabilities work ends May 6, 2027.","facts":[["RBTs in New Jersey","5,968 (2.2% of the US), up 27.1% in a year"],["BCBAs / BCaBAs","4,118 BCBAs (5th in the US) and 114 BCaBAs"],["State license for behavior analysts","Yes: State Board of Applied Behavior Analyst Examiners (N.J.S.A. 45:8B-91)"],["State CE on top of the BACB","None; renewal needs current BACB certification"],["What's changing","DDD licensing exemption ends May 6, 2027; Early Intervention's ends May 6, 2029"],["RBTs and Medicaid","Optional: an RBT or a degree/experience route"]],"sections":[["What New Jersey RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count."],["What New Jersey behavior analysts need","Renew every 2 years with current BCBA, BCBA-D or BCaBA certification; there's no extra New Jersey CE. If you work in DDD services without a license, the exemption ends May 6, 2027."]],"faq":[["Does New Jersey require CE beyond the BACB?","No. New Jersey renewal requires current BACB certification, so your BACB CE is what counts."],["When does the DDD licensing exemption end in New Jersey?","May 6, 2027. After that, BACB certification alone doesn't replace a New Jersey license for that work."],["How many BCBAs are in New Jersey?","4,118 as of November 2026, the fifth most in the US (BACB certificant data)."]],"keywords":["new jersey behavior analyst license","nj bcba requirements","registered behavior technician new jersey","rbt new jersey requirements","nj ddd behavior analyst license 2027","bcba ceus new jersey"],"sources":"BACB certificant data (Nov 24, 2026); N.J.A.C. 13:42B; NJ DDD bulletin (Oct 27, 2026).","updated":"December 2026","wiki":"https://en.wikipedia.org/wiki/New_Jersey"},{"slug":"virginia","name":"Virginia","rbt":5198,"bcba":2372,"bcaba":253,"share":"1.9%","grow":"+16.8%","trends":56,"metros":[],"why":"Virginia sets the strictest hour rule here: 32 hours for LBAs (20 for LaBAs), 4 in ethics, from BACB-recognized sponsors; 253 BCaBAs (2nd in the US).","teaser":"32 CE hours from BACB sponsors","title":"Virginia RBT & BCBA Requirements (2027) | CEU4ALL","description":"Virginia LBAs need 32 CE hours (LaBAs 20) with 4 in ethics from BACB-recognized sponsors, renewing in 2027. What Virginia RBTs and analysts need.","h1":"RBT and BCBA requirements in Virginia","focus":"Virginia RBT requirements","intro":"Virginia's Board of Medicine requires licensed behavior analysts to complete 32 CE hours each biennium (20 for assistants), with 4 in ethics, from sponsors the BACB recognizes, so BACB ACE courses count.","facts":[["RBTs in Virginia","5,198 (1.9% of the US), up 16.8% in a year"],["BCBAs / BCaBAs","2,372 BCBAs and 253 BCaBAs (2nd most in the US)"],["State license for behavior analysts","Yes: Board of Medicine, LBA and LaBA (Va. Code § 54.1-2957.16)"],["State CE on top of the BACB","32 hours (LBA) / 20 hours (LaBA) per biennium, 4 in ethics, from a sponsor the BACB recognizes; first renewal exempt (18VAC85-150-100)"],["Renewal timing","Odd-numbered years, in your birth month (next: 2027)"],["RBTs and Medicaid","Not required: supervised personnel can bill technician codes"]],"sections":[["What Virginia RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count."],["What Virginia behavior analysts need","32 CE hours per biennium for LBAs, 20 for LaBAs, including 4 in ethics, from BACB-recognized sponsors such as CEU4ALL. The Ethics & Supervision bundle covers your 4 ethics hours."]],"faq":[["How many CE hours do Virginia behavior analysts need?","32 hours per biennium for LBAs and 20 for LaBAs, including 4 in ethics, from a sponsor the BACB recognizes (18VAC85-150-100)."],["When do Virginia behavior analyst licenses renew?","In odd-numbered years, in the licensee's birth month. The next renewal year is 2027."],["Do BACB ACE courses count in Virginia?","Yes. Virginia accepts CE from sponsors the BACB recognizes."]],"keywords":["virginia behavior analyst ce requirements","virginia lba 32 hours","virginia laba ce requirements","registered behavior technician virginia","bcba virginia requirements","virginia board of medicine behavior analyst"],"sources":"BACB certificant data ses count, and so do hours that maintain a certification like the RBT (55 Pa. Code § 5240.83)"],["IBHS training (analysts)","16 hours a year from the same kinds of providers"],["Behavior Specialists","License expires Dec 31, 2026; the only CE is 2 hours of Act 31 child abuse training from a state-approved provider"]],"sections":[["What Pennsylvania RBTs need","RBTs in every state follow the BACB: a 2-year cycle with 12 PDUs before each recertification (most current RBTs: before their 2028 date). PDUs must be RBT-specific; CE for BCBAs doesn't count. If you work as a BHT-ABA in IBHS, those same PDUs count toward your 20 training hours a year."],["What Pennsylvania behavior analysts need","BACB recertification, plus 16 training hours a year if you provide IBHS behavior analytic services (ACE courses count). Licensed Behavior Specialists renew by December 31, 2026 with 2 hours of Act 31 training from a state-approved provider."],["For Pennsylvania agencies","Your BHT-ABA staff need 20 hours every year. Group pricing on the RBT bundle covers 12 of them in one purchase."]],"faq":[["How many training hours do Pennsylvania BHT-ABA staff need?","20 hours of ABA training a year under the IBHS rules (55 Pa. Code § 5240.83). Courses from BACB-approved CE providers count, including hours earned to keep an RBT."],["Does Pennsylvania license behavior analysts?","No. Pennsylvania licenses Behavior Specialists through the Board of Medicine; there's no separate behavior analyst license."],["Is the RBT required for IBHS in Pennsylvania?","No. The RBT is one of several routes to the BHT-ABA qualification, alongside the BCaBA, BCAT and a training-and-experience route."]],"keywords":["pennsylvania bht-aba training hours","ibhs training requirements pennsylvania","pa behavior specialist license renewal","registered behavior technician pennsylvania","bcba pennsylvania requirements","act 31 behavior specialist"],"sources":"BACB certificant data (Nov 24, 2026); 55 Pa. Code §§ 5240.81, 5240.     <h2>What is a PDU?</h2>

function account(tab='home'){if(!S.user)return loginPage();const mine=(S.owned||[]).map(id=>byId[id]).filter(c=>c&&!c.bundle);const earned=mine.filter(c=>prog(c.id).passed).reduce((s,c)=>s+c.credits,0);const next=mine.find(c=>!prog(c.id).passed&&(prog(c.id).lessons>0||prog(c.id).attempts.length))||mine.find(c=>!prog(c.id).passed);const certs=mine.filter(c=>prog(c.id).passed);const lrow=c=>{const p=prog(c.id);const pct=p.passed?100:Math.round((p.lessons/4)*85+(p.attempts.length?10:0));return`<div class="lcard"><div><span class="code" style="font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700">${esc(c.code)} · ${esc(c.label)}</span><h3 style="font-size:19px;margin:3px 0 10px"><a href="#/learn/${c.id}">${esc(c.short)}</a></h3>
      <div class="prog ${p.passed ? 'green' : ''}"><i style="width:${pct}%"></i></div><div style="display:flex;justify-content:space-between;margin-top:8px;align-items:center;gap:10px;flex-wrap:wrap"><span class="tiny muted">${p.lessons} of 4 lessons${p.attempts.length ? ` · best score ${Math.max(...p.attempts)}%` : ''}</span>${attemptsBar(p)}</div></div>

    <h3 style="margin-bottom:12px">In progress</h3>${mine.filter(c => !prog(c.id).passed && (prog(c.id).lessons || prog(c.id).attempts.length)).map(lrow).join('') || '<p class="muted">Nothing in progress.</p>'}
    <p style="margin-top:16px"><a class="link-arrow" href="#/account/courses">All my courses</a></p>`);}
const LESSON_TXT=[['The situation','It is 3:40 on a Tuesday. Your client has worked well for twenty minutes, then pushes the materials away. What happens in the next ten seconds decides whether the rest of the session works. This lesson opens with that moment, then breaks down what a skilled clinician notices first.'],['Why it works','The principle behind the procedure, in plain words, with the research it rests on, and where it tends to break down in real homes, clinics and classrooms.'],['Doing it well','A step-by-step walk-through with a short video demonstration, a printable checklist, and the three adjustments experienced clinicians make most often.'],['Common mistakes','The errors that cost the most progress, how to spot them early in your data, and what to say to the family or supervisor when they happen.'],];function learn(id){const c=byId[id];if(!c)return notFound();const p=prog(id),cur=Math.min(p.lessons,3);const[t,body]=LESSON_TXT[cur];return`<div class="player"><aside><h4>${esc(c.short)}</h4><div class="small muted" style="padding:0 22px 14px">${esc(c.label)} · ${p.lessons} of 4 lessons</div>

  <main><span class="eyebrow">${esc(c.code)} · Lesson ${cur + 1} of 4</span><h2>${t}</h2>
    <div class="media photo"><div class="cap">Video · ${t.toLowerCase()} (3–5 minutes, captions on)</div></div>
    <p>${body}</p>
    <div class="qbox" data-q="kc"><h4>Knowledge check</h4><p class="muted small">Required by the BACB for self-paced courses. Answer to continue.</p>${qHTML(QB[c.role][cur], 'kc')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:22px"><span class="tiny muted">Progress saves automatically</span>
      ${p.lessons >= 4 ? `<a class="btn gold" href="#/exam/${id}">Go to the final exam</a>` : `<button class="btn" data-act="lesson" data-id="${id}">Mark complete & continue</button>`}</div></main></div>`;}
const QB={RBT:[['Tokens work best when they are delivered…',['Right after the target behavior','At the end of the session','Only when the client asks','At random times'],0],['Which session note is objective?',['Client had a good day','Client seemed frustrated','Client requested a break 3 times using a picture card','Session went well overall'],2],['When a client withdraws assent, the RBT should first…',['Finish the trial quickly','Pause the demand and follow the supervisor’s plan','End the session and leave','Offer a bigger reward to continue'],1],['Prompt fading means…',['Using the same prompt every time','Gradually reducing prompts so the skill happens independently','Removing all prompts at once','Letting the parent prompt instead'],1],['Negative reinforcement…',['Is the same as punishment','Removes something to increase a behavior','Always involves yelling','Decreases a behavior'],1],],BCBA:[['How many CE does a BCBA need per 2-year cycle?',['20','24','32','36'],2],['How many of those must be Ethics CE?',['2','3','4','6'],2],['DRO stands for…',['Differential reinforcement of other behavior','Direct response observation','Delayed reinforcement only','Differential response option'],0],['The four parts of Behavioral Skills Training are…',['Instruction, modeling, rehearsal, feedback','Assessment, plan, review, sign-off','Prompt, fade, reinforce, probe','Observe, record, graph, report'],0],['Supervision CE for supervisors with certification end dates in 2027 or later:',['2','3','4','6'],2],],OT:[['How many CE hours do Florida OTs need each biennium?',['20','24','26','30'],2],['Prevention of Medical Errors at every renewal:',['1 hour','2 hours','3 hours','Not required'],1],['Most home-study hours a Florida OT can apply:',['6','12','20','26'],1],['The next Florida OT license deadline is…',['Dec 31, 2026','Feb 28, 2027','Mar 31, 2027','Feb 28, 2028'],1],['HIV/AIDS education for a first renewal:',['None','1 hour','2 hours','3 hours'],1],],};function qHTML(q,name){return`
